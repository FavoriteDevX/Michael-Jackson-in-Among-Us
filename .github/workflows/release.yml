name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      # Zip mirrors the game folder layout so players can extract it straight into "Among Us/".
      - name: Package
        run: |
          pkg=package/BepInEx/plugins/MichaelJacksonRole
          mkdir -p "$pkg/Sounds"
          cp bin/Release/net6.0/MichaelJacksonRole.dll "$pkg/"
          cp Sounds/README.md "$pkg/Sounds/"
          cd package && zip -r "../MichaelJacksonRole-${GITHUB_REF_NAME}.zip" BepInEx

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MichaelJacksonRole-${{ github.ref_name }}.zip
            bin/Release/net6.0/MichaelJacksonRole.dll
